name: admin-jobs

# Manually triggered — either from the Actions tab, or (once Task 11's
# frontend/api/trigger-job.js exists) programmatically via GitHub's REST API
# ("workflow dispatch") from the admin page's job-trigger UI. `job_type`
# selects which one-shot backend pipeline step to run.
#
# Both job types are pure-Python and have no dependency on the ujin scrape
# service / docker-compose used for local dev (see docker-compose.yml):
# CV parsing and style analysis never touch a scraper — only Google Scholar
# sources need ujin, and Scholar is disabled by default.
on:
  workflow_dispatch:
    inputs:
      job_type:
        description: "Which admin job to run"
        required: true
        type: choice
        default: cv-sync
        options:
          - cv-sync
          - style-regen

permissions:
  contents: read

# One admin job at a time, repo-wide. The only thing stopping a double-click,
# a page refresh, or a second browser tab from starting a second full
# `hct-manager run` was AdminPage.jsx's client-side `busy` flag — which is not
# a guard at all once a second client is involved. Two concurrent runs would
# spend OpenRouter tokens twice against the project's budget ceiling *and*
# write to the same Supabase tables at the same time.
#
# `cancel-in-progress: false` deliberately: a second dispatch queues behind the
# first and then runs, rather than killing a pipeline that may be halfway
# through upserting publications. The cost is a short wait, not a torn write.
concurrency:
  group: admin-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Well clear of a normal CV-sync run (a few minutes: parse + per-entry LLM
    # fallback + upsert), but low enough that a wedged LLM/Supabase call fails
    # the run instead of burning the 6h GitHub default while holding the
    # concurrency slot above and blocking every later dispatch.
    timeout-minutes: 20
    env:
      # Config.data_dir (backend/src/config.py) defaults to two directories
      # above config.py itself, which only resolves to <repo>/backend/data
      # when running from an editable checkout. A `pip install ./backend`
      # here installs into site-packages, so that default resolves to
      # somewhere under site-packages instead — HCT_DATA_DIR must be set
      # explicitly to point back at the checked-out data/ directory (sources,
      # templates, inputs, state). This mirrors backend/Dockerfile's
      # `ENV HCT_DATA_DIR=/app/data` for the same reason.
      #
      # Only non-secret config belongs at job level. SB_SEC_KEY (bypasses all
      # RLS) and OPENROUTER_API_KEY are set per-step on the two `hct-manager`
      # steps below instead: a job-level `env:` is visible to *every* step,
      # including third-party actions and `pip install`, whose build backends
      # run arbitrary code from PyPI with no lockfile/hashes pinning them.
      HCT_DATA_DIR: ${{ github.workspace }}/backend/data
    steps:
      # Third-party actions are pinned to the full commit SHA of the tag named
      # in the trailing comment: a tag is mutable and can be repointed at new
      # code by whoever controls the action repo, a SHA cannot.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # No secrets in scope here on purpose — see the job-level `env:` note.
      # backend/pyproject.toml has no lockfile or hashes, so this step resolves
      # and executes third-party build-backend code from PyPI.
      - name: Install hct-manager
        run: pip install ./backend

      # Repo secrets — configure these under Settings > Secrets and
      # variables > Actions. Never hardcode real values here.
      - name: cv-sync — fetch the uploaded CV, re-run the CV pipeline
        if: ${{ inputs.job_type == 'cv-sync' }}
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SEC_KEY: ${{ secrets.SB_SEC_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: hct-manager fetch-cv && hct-manager run

      - name: style-regen — regenerate the style profile from source_excerpt
        if: ${{ inputs.job_type == 'style-regen' }}
        env:
          SB_URL: ${{ secrets.SB_URL }}
          SB_SEC_KEY: ${{ secrets.SB_SEC_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: hct-manager style-regen
