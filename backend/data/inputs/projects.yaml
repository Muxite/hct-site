projects:
  - title: Brain2Speech
    tagline: State-of-the-art brain computer interfaces and 3D biomechanical articulatory speech synthesis
    summary: |
      Brain2Speech combines brain-computer interfaces with 3D biomechanical
      articulatory speech synthesis, aiming to restore natural speech for
      people who have lost the ability to talk.
    link: https://hct.ece.ubc.ca/brain2speech/
    image: ./Human Communication Technologies Lab_files/brain2speech.png
