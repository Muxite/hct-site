# Featured projects — the source of truth for the site's project-centric
# restructure (see docs/PROJECTS.md). Supersedes research.yaml: sync-content
# uses this file when present, upserting `research` + `project_people` and
# stamping `project_slug` onto the listed papers (clearing it from any paper
# no longer listed here). Run:  hct-manager sync-content
#
# `papers:` was proposed by one batched AI-clustering call over all 551
# publications' titles/years/venues (src/cluster.py) and reviewed/pasted in
# here; edit freely — this file is the only thing that reaches Supabase.
# Anything not listed under a project just stays in the plain timeline.
#
